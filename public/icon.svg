<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0a0a"/>
      <stop offset="100%" stop-color="#121212"/>
    </linearGradient>
    <linearGradient id="redGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ef4444"/>
      <stop offset="100%" stop-color="#dc2626"/>
    </linearGradient>
  </defs>

  <!-- Rounded square background -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)"/>
  <rect x="16" y="16" width="480" height="480" rx="100" fill="none" stroke="#27272a" stroke-width="1.5"/>

  <!-- Minimalist Rod of Asclepius -->
  <g transform="translate(256, 256)">
    <!-- Vertical rod -->
    <line x1="0" y1="-120" x2="0" y2="120" stroke="#dc2626" stroke-width="8" stroke-linecap="round"/>

    <!-- Snake body: two elegant curves wrapping the rod -->
    <path d="M 0 -90 C 40 -70 -40 -30 0 -10 C 40 10 -40 50 0 70"
          fill="none" stroke="#ffffff" stroke-width="6" stroke-linecap="round"/>

    <!-- Snake head -->
    <circle cx="0" cy="-95" r="7" fill="#ffffff"/>

    <!-- Wings at top -->
    <path d="M 0 -120 C -20 -130 -35 -125 -40 -115" fill="none" stroke="#dc2626" stroke-width="5" stroke-linecap="round"/>
    <path d="M 0 -120 C 20 -130 35 -125 40 -115" fill="none" stroke="#dc2626" stroke-width="5" stroke-linecap="round"/>
  </g>
</svg>
